name: Build and deploy marche-circulo-esm

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        deploy-environment:
          ["${{ github.ref_name == 'main' && 'prod' || 'stg' }}"]

    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      IMAGE_TAG: ${{ github.sha }}
      TF_ENV_FILE: environments/${{ matrix.deploy-environment }}.tfvars
      TF_STATE_BUCKET: marche-terraform
      TF_STATE_PREFIX: marche-circulo-esm/${{ matrix.deploy-environment }}

    concurrency:
      group: marche-circulo-esm-${{ matrix.deploy-environment }}-terraform
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/809550202314/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"
        working-directory: terraform

      - name: Validate environment tfvars file
        run: |
          test -f "${{ env.TF_ENV_FILE }}" || {
            echo "Missing terraform/${{ env.TF_ENV_FILE }}"
            exit 1
          }
        working-directory: terraform

      - name: Import existing Artifact Registry repository
        run: |
         if terraform state list -no-color 2>/dev/null | grep -qx "google_artifact_registry_repository.app"; then
            echo "Artifact Registry repository already tracked in Terraform state."
            exit 0
          fi

          if gcloud artifacts repositories describe marche-circulo-esm \
            --location=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            terraform import \
              -input=false \
              -var-file=${{ env.TF_ENV_FILE }} \
              -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
              -var="image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bootstrap/bootstrap:placeholder" \
              google_artifact_registry_repository.app \
              projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-central1/repositories/marche-circulo-esm
          else
            echo "Artifact Registry repository does not exist yet; Terraform will create it."
          fi
        working-directory: terraform

      - name: Import existing Cloud Run service account
        run: |
          if terraform state list -no-color 2>/dev/null | grep -qx "google_service_account.cloud_run"; then
            echo "Cloud Run service account already tracked in Terraform state."
            exit 0
          fi

          SERVICE_ACCOUNT_EMAIL="marche-circulo-esm-${{ matrix.deploy-environment }}-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          if gcloud iam service-accounts describe "$SERVICE_ACCOUNT_EMAIL" \
            --project=${{ secrets.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            terraform import \
              -input=false \
              -var-file=${{ env.TF_ENV_FILE }} \
              -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
              -var="image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bootstrap/bootstrap:placeholder" \
              google_service_account.cloud_run \
              projects/${{ secrets.GCP_PROJECT_ID }}/serviceAccounts/$SERVICE_ACCOUNT_EMAIL
          else
            echo "Cloud Run service account does not exist yet; Terraform will create it."
          fi
        working-directory: terraform

      - name: Bootstrap Terraform resources
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var-file=${{ env.TF_ENV_FILE }} \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bootstrap/bootstrap:placeholder" \
            -target=google_project_service.required \
            -target=google_artifact_registry_repository.app \
            -target=google_service_account.cloud_run
        working-directory: terraform

      - name: Resolve image repository
        id: image-repository
        run: |
          ENV_NAME="${{ matrix.deploy-environment }}"
          IMAGE_REPOSITORY="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/marche-circulo-esm/marche-circulo-esm-${ENV_NAME}"
          echo "image_repository=$IMAGE_REPOSITORY" >> $GITHUB_OUTPUT

      - name: Build and push container image
        env:
          NEXT_PUBLIC_API_USERS_V2: ${{ matrix.deploy-environment == 'prod' && secrets.NEXT_PUBLIC_API_USERS_V2_PROD || secrets.NEXT_PUBLIC_API_USERS_V2 }}
          NEXT_PUBLIC_USERS_V2_API_KEY: ${{ matrix.deploy-environment == 'prod' && secrets.NEXT_PUBLIC_USERS_V2_API_KEY_PROD || secrets.NEXT_PUBLIC_USERS_V2_API_KEY }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_USERS_V2="${NEXT_PUBLIC_API_USERS_V2}" \
            --build-arg NEXT_PUBLIC_USERS_V2_API_KEY="${NEXT_PUBLIC_USERS_V2_API_KEY}" \
            -t ${{ steps.image-repository.outputs.image_repository }}:${IMAGE_TAG} \
            .
          docker push ${{ steps.image-repository.outputs.image_repository }}:${IMAGE_TAG}

      - name: Apply Terraform
        env:
          SMTP_ENDERECO: ${{ matrix.deploy-environment == 'prod' && secrets.SMTP_ENDERECO_PROD || secrets.SMTP_ENDERECO }}
          SMTP_PORTA: ${{ matrix.deploy-environment == 'prod' && secrets.SMTP_PORTA_PROD || secrets.SMTP_PORTA }}
          SMTP_SENDGRID_TOKEN: ${{ matrix.deploy-environment == 'prod' && secrets.SMTP_SENDGRID_TOKEN_PROD || secrets.SMTP_SENDGRID_TOKEN }}
          SMTP_USUARIO: ${{ matrix.deploy-environment == 'prod' && secrets.SMTP_USUARIO_PROD || secrets.SMTP_USUARIO }}
          SIGNUP_CONFIRMATION_FROM_EMAIL: ${{ matrix.deploy-environment == 'prod' && secrets.SIGNUP_CONFIRMATION_FROM_EMAIL_PROD || secrets.SIGNUP_CONFIRMATION_FROM_EMAIL }}
          SIGNUP_CONFIRMATION_REPLY_TO: ${{ matrix.deploy-environment == 'prod' && secrets.SIGNUP_CONFIRMATION_REPLY_TO_PROD || secrets.SIGNUP_CONFIRMATION_REPLY_TO }}
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var-file=${{ env.TF_ENV_FILE }} \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image=${{ steps.image-repository.outputs.image_repository }}:${{ env.IMAGE_TAG }}" \
            -var='runtime_environment_variables={
              NODE_ENV="production",
              SMTP_ENDERECO="'${SMTP_ENDERECO}'",
              SMTP_PORTA="'${SMTP_PORTA}'",
              SMTP_SENDGRID_TOKEN="'${SMTP_SENDGRID_TOKEN}'",
              SMTP_USUARIO="'${SMTP_USUARIO}'",
              SIGNUP_CONFIRMATION_FROM_EMAIL="'${SIGNUP_CONFIRMATION_FROM_EMAIL}'",
              SIGNUP_CONFIRMATION_REPLY_TO="'${SIGNUP_CONFIRMATION_REPLY_TO}'"
            }'
        working-directory: terraform
