name: Build and deploy marche-circulo-esm

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'stg' }}
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      IMAGE_TAG: ${{ github.sha }}
      TF_ENV_FILE: environments/${{ github.ref_name == 'main' && 'prod' || 'stg' }}.tfvars
      TF_STATE_BUCKET: marche-terraform
      TF_STATE_PREFIX: marche-circulo-esm/${{ github.ref_name == 'main' && 'prod' || 'stg' }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REPOSITORY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/marche-circulo-esm/marche-circulo-esm-${{ github.ref_name == 'main' && 'prod' || 'stg' }}
      NEXT_PUBLIC_API_USERS_V2: ${{ github.ref_name == 'main' && secrets.NEXT_PUBLIC_API_USERS_V2_PROD || secrets.NEXT_PUBLIC_API_USERS_V2 }}
      NEXT_PUBLIC_USERS_V2_API_KEY: ${{ github.ref_name == 'main' && secrets.NEXT_PUBLIC_USERS_V2_API_KEY_PROD || secrets.NEXT_PUBLIC_USERS_V2_API_KEY }}
      TF_VAR_runtime_environment_variables: >-
        {"NODE_ENV":"production","SMTP_ENDERECO":${{ toJSON(github.ref_name == 'main' && secrets.SMTP_ENDERECO_PROD || secrets.SMTP_ENDERECO) }},"SMTP_PORTA":${{ toJSON(github.ref_name == 'main' && secrets.SMTP_PORTA_PROD || secrets.SMTP_PORTA) }},"SMTP_SENDGRID_TOKEN":${{ toJSON(github.ref_name == 'main' && secrets.SMTP_SENDGRID_TOKEN_PROD || secrets.SMTP_SENDGRID_TOKEN) }},"SMTP_USUARIO":${{ toJSON(github.ref_name == 'main' && secrets.SMTP_USUARIO_PROD || secrets.SMTP_USUARIO) }},"SIGNUP_CONFIRMATION_FROM_EMAIL":${{ toJSON(github.ref_name == 'main' && secrets.SIGNUP_CONFIRMATION_FROM_EMAIL_PROD || secrets.SIGNUP_CONFIRMATION_FROM_EMAIL) }},"SIGNUP_CONFIRMATION_REPLY_TO":${{ toJSON(github.ref_name == 'main' && secrets.SIGNUP_CONFIRMATION_REPLY_TO_PROD || secrets.SIGNUP_CONFIRMATION_REPLY_TO) }}}

    concurrency:
      group: marche-circulo-esm-${{ github.ref_name == 'main' && 'prod' || 'stg' }}-terraform
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/809550202314/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Validate runtime email secrets
        env:
          SMTP_ENDERECO_SELECTED: ${{ github.ref_name == 'main' && secrets.SMTP_ENDERECO_PROD || secrets.SMTP_ENDERECO }}
          SMTP_PORTA_SELECTED: ${{ github.ref_name == 'main' && secrets.SMTP_PORTA_PROD || secrets.SMTP_PORTA }}
          SMTP_SENDGRID_TOKEN_SELECTED: ${{ github.ref_name == 'main' && secrets.SMTP_SENDGRID_TOKEN_PROD || secrets.SMTP_SENDGRID_TOKEN }}
          SMTP_USUARIO_SELECTED: ${{ github.ref_name == 'main' && secrets.SMTP_USUARIO_PROD || secrets.SMTP_USUARIO }}
          SIGNUP_CONFIRMATION_FROM_EMAIL_SELECTED: ${{ github.ref_name == 'main' && secrets.SIGNUP_CONFIRMATION_FROM_EMAIL_PROD || secrets.SIGNUP_CONFIRMATION_FROM_EMAIL }}
          SIGNUP_CONFIRMATION_REPLY_TO_SELECTED: ${{ github.ref_name == 'main' && secrets.SIGNUP_CONFIRMATION_REPLY_TO_PROD || secrets.SIGNUP_CONFIRMATION_REPLY_TO }}
        run: |
          set -euo pipefail
          missing=()

          for key in \
            SMTP_ENDERECO_SELECTED \
            SMTP_PORTA_SELECTED \
            SMTP_SENDGRID_TOKEN_SELECTED \
            SMTP_USUARIO_SELECTED \
            SIGNUP_CONFIRMATION_FROM_EMAIL_SELECTED \
            SIGNUP_CONFIRMATION_REPLY_TO_SELECTED; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing deploy secrets: ${missing[*]}"
            exit 1
          fi

      - name: Prepare Terraform prerequisites
        working-directory: terraform
        run: |
          set -euo pipefail

          test -f "$TF_ENV_FILE" || {
            echo "Missing terraform/$TF_ENV_FILE"
            exit 1
          }

          terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=$TF_STATE_PREFIX"

          import_if_exists() {
            local address="$1"
            local resource_id="$2"

            if terraform state list -no-color 2>/dev/null | grep -qx "$address"; then
              echo "$address already tracked in Terraform state."
              return
            fi

            terraform import \
              -input=false \
              -var-file="$TF_ENV_FILE" \
              -var="project_id=$PROJECT_ID" \
              -var="image=us-central1-docker.pkg.dev/$PROJECT_ID/bootstrap/bootstrap:placeholder" \
              "$address" \
              "$resource_id"
          }

          if gcloud artifacts repositories describe marche-circulo-esm \
            --location=us-central1 \
            --project="$PROJECT_ID" >/dev/null 2>&1; then
            import_if_exists \
              google_artifact_registry_repository.app \
              "projects/$PROJECT_ID/locations/us-central1/repositories/marche-circulo-esm"
          fi

          SERVICE_ACCOUNT_EMAIL="marche-circulo-esm-$DEPLOY_ENV-run@$PROJECT_ID.iam.gserviceaccount.com"
          if gcloud iam service-accounts describe "$SERVICE_ACCOUNT_EMAIL" --project="$PROJECT_ID" >/dev/null 2>&1; then
            import_if_exists \
              google_service_account.cloud_run \
              "projects/$PROJECT_ID/serviceAccounts/$SERVICE_ACCOUNT_EMAIL"
          fi

          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var-file="$TF_ENV_FILE" \
            -var="project_id=$PROJECT_ID" \
            -var="image=us-central1-docker.pkg.dev/$PROJECT_ID/bootstrap/bootstrap:placeholder" \
            -target=google_project_service.required \
            -target=google_artifact_registry_repository.app \
            -target=google_service_account.cloud_run

      - name: Build and push container image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_USERS_V2="$NEXT_PUBLIC_API_USERS_V2" \
            --build-arg NEXT_PUBLIC_USERS_V2_API_KEY="$NEXT_PUBLIC_USERS_V2_API_KEY" \
            -t "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Apply Terraform
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var-file="$TF_ENV_FILE" \
            -var="project_id=$PROJECT_ID" \
            -var="image=$IMAGE_REPOSITORY:$IMAGE_TAG"
